
name: Build FF Overlay APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Extract source
        run: |
          unzip -q FFOverlayV3_MobileBuild.zip

      - name: Build APK
        working-directory: FFOverlayV3
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FFOverlayV3-APK
          path: FFOverlayV3/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
